name: commerce_server
description: HTTP API for the commerce showcase, on dust_server and PostgreSQL.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  commerce_admin_shared: ^0.1.0
  commerce_shared: ^0.1.0
  # RFC 4180 parsing for merchant catalogue imports.
  csv: ^6.0.0
  # Password hashing and token generation.
  cryptography: ^2.9.0
  dust_dart: ^0.3.1
  dust_db_postgres: ^0.3.1
  dust_server: ^0.3.1
  intl: ^0.20.2
  mailer: ^7.2.0

dev_dependencies:
  test: ^1.26.0
  very_good_analysis: ^10.3.0
